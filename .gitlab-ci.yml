image: registry.znuny.com/znuny/internal/docker-otrs6ci:$OTRS_TAG

stages:
  - test
  - deploy

mysql:
  stage: test
  services:
    - name: docker.io/elgalu/selenium:$SELENIUM_TAG
    - name: registry.znuny.com/znuny/internal/docker-mysql:$MYSQL_TAG
      alias: mysql
  variables:
    SELENIUM_SCREENSHOTS: 'true'
  artifacts:
    expire_in: 1 week
    when: on_failure
    untracked: true
  script:
    - env
    - pwd
    - /run.sh
    - su -c "perl /opt/otrs/bin/otrs.Console.pl Znuny4OTRS::AdvancedPackageManager::InstallSOPM /opt/otrs/Znuny4OTRS-AutoSelect.sopm" -s /bin/bash otrs
    - /unittest.sh

deploy:
  stage: deploy
  script:
    - pwd
    - sh /sync_repo.sh git@github.com:znuny/Znuny4OTRS-AutoSelect.git
